# Config for training on the already-preprocessed images in data/processed.
# Use this one on Kaggle: it skips the per-epoch OpenCV crop/CLAHE work, which
# otherwise starves the GPU because it runs single-threaded through Python.
data:
  raw_dir: data/processed
  processed_dir: data/processed
  mask_dir: data/masks
  img_size: 224
  val_split: 0.15
  test_split: 0.15
  num_workers: 2                      # Kaggle gives 4 vCPUs; 2 workers avoids thrashing
  use_pseudo_masks: true
  preprocessed_input: true            # files already cropped/CLAHE'd; decode only
  precomputed_masks: true             # read data/masks instead of regenerating each epoch

model:
  backbone: efficientnet_b3
  pretrained: true
  num_classes: 4
  dropout: 0.4

tensorflow:
  require_gpu: true                   # fail fast on Kaggle if the accelerator is off
  detection_epochs: 32
  classification_epochs: 64
  freeze_backbone_epochs: 5
  batch_size: 32
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 1.0e-5
  reduce_lr_factor: 0.5
  reduce_lr_patience: 4
  early_stopping_patience: 8
  mixed_precision: true

pytorch:
  segmentation_epochs: 32
  batch_size: 16
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine_annealing
  T_max: 32
  early_stopping_patience: 8
  mixed_precision: true

segmentation:
  encoder: efficientnet-b3            # smp registry key uses a hyphen
  decoder_channels: [256, 128, 64, 32, 16]
  dice_weight: 0.6
  bce_weight: 0.4
